# Render Blueprint — AI 신문고 백엔드 (FastAPI, Docker)
# 구성: 백엔드 = Render / 프론트엔드 = Vercel (frontend/) / DB = Neon PostgreSQL
# sync: false 항목은 대시보드 Environment 탭에서 직접 값을 입력한다.

services:
  - type: web
    name: ai-sinmungo-backend
    runtime: docker
    plan: starter         # RAM 512MB, 슬립 없음. KoBERT를 켜려면 standard(2GB) 이상 필요
    region: singapore     # Neon 프로젝트도 Asia Pacific (Singapore)로 만들면 지연 최소
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL          # 필수: Neon 연결 문자열 (postgresql://...?sslmode=require)
        sync: false
      - key: OPENAI_API_KEY        # 필수: 모든 LLM 에이전트 + Whisper STT
        sync: false
      - key: TAVILY_API_KEY        # 선택: 웹 검색
        sync: false
      - key: LAW_API_KEY           # 선택: 국가법령정보센터
        sync: false
      - key: ADMIN_API_KEY         # 선택: 설정 시 관리자 API에 X-Admin-Api-Key 헤더 필요
        sync: false
      - key: OPENAI_MODEL_NAME
        value: gpt-4o-mini
      - key: BACKEND_MODEL
        value: gpt-4o-mini
      - key: ML_ENABLE_KOBERT      # Dockerfile build arg로도 전달됨. true로 바꾸면 plan도 standard로 올릴 것
        value: "false"
      - key: ENABLE_CHROMA
        value: "false"
      - key: DEBUG
        value: "false"
